# MCP source registry.
#
# Adding a source is a config change, not a code change: the ingestion agent
# discovers each server's tools at runtime.
#
# `requires_env` gates readiness -- a server missing its credentials is reported
# as "not_configured" rather than crashing the platform.
# `tools.allow` is the read-only allowlist. The Knowledge Brain is the write
# boundary, so write tools are never exposed to the agent.

servers:
  # Atlassian (Jira + Confluence) via the community mcp-atlassian server.
  # https://github.com/sooperset/mcp-atlassian
  atlassian:
    description: Jira issues and Confluence pages
    # One server, two logical sources: route tools so records are attributed
    # to Jira or Confluence rather than to whichever was requested first.
    sources:
      jira: ["jira_*"]
      confluence: ["confluence_*"]
    transport: stdio
    command: uvx
    args: ["mcp-atlassian"]
    requires_env: [JIRA_URL, JIRA_USERNAME, JIRA_API_TOKEN]
    env:
      JIRA_URL: ${JIRA_URL}
      JIRA_USERNAME: ${JIRA_USERNAME}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      CONFLUENCE_URL: ${CONFLUENCE_URL}
      CONFLUENCE_USERNAME: ${CONFLUENCE_USERNAME:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      READ_ONLY_MODE: "true"
    tools:
      allow:
        - "jira_search"
        - "jira_get_issue"
        - "jira_get_project_issues"
        - "jira_get_epic_issues"
        - "jira_get_*"
        - "confluence_search"
        - "confluence_get_page"
        - "confluence_get_page_children"
        - "confluence_get_comments"
        - "confluence_get_*"
      deny:
        - "*_create_*"
        - "*_update_*"
        - "*_delete_*"
        - "*_add_*"

  # GitHub via the official remote MCP server.
  # https://github.com/github/github-mcp-server
  github:
    description: Repositories, source code, pull requests
    sources: [github]
    transport: streamable_http
    url: https://api.githubcopilot.com/mcp/
    requires_env: [GITHUB_TOKEN]
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
    tools:
      allow:
        - "get_file_contents"
        - "search_code"
        - "search_repositories"
        - "list_commits"
        - "get_commit"
        - "list_pull_requests"
        - "pull_request_read"
        - "list_issues"
        - "issue_read"
        - "list_branches"
        - "get_*"
        - "list_*"
        - "search_*"
      deny:
        - "create_*"
        - "update_*"
        - "delete_*"
        - "merge_*"
        - "push_*"
        - "fork_*"
        - "*_write"

  # Local fixture server used by the test suite and for offline demos.
  # Serves the same logical sources so the graph can be exercised without
  # enterprise credentials.
  fixture:
    description: Deterministic in-repo fixture source (tests and demos)
    sources: [fixture]
    transport: stdio
    command: ${KB_PYTHON:-python3}
    args: ["-m", "tests.fake_mcp_server"]
    enabled: true
    tools:
      allow: ["*"]
      deny: ["*_create_*", "*_update_*", "*_delete_*"]
